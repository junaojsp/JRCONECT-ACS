name: PABX admin MCP checks
on:
  push:
    branches: ["feat/pabx-admin-gateway"]
  pull_request:
    branches: ["feat/pabx-rest-connector-20261103"]
jobs:
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax checks
        run: |
          node --check mcp/pabx-admin.js
          node --check mcp/pabx.js
          python3 -m py_compile scripts/prepare-pabx-admin-mcp.py
      - name: Install dependencies and run authorization tests
        working-directory: mcp
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --test tests/pabx-admin-auth.test.js
