name: VoIP IXC VoiceCopy reconciliation
on:
  pull_request:
    paths:
      - 'voip-central.php'
      - 'mcp/integrations/ixc-voip-request-inspector.js'
      - 'scripts/voip-request-marker-preflight.mjs'
      - 'tests/voip-request-marker.test.mjs'
      - 'lib/voip-reconcile.php'
      - 'lib/voip-operational.php'
      - 'lib/voip-stock.php'
      - 'lib/voip-auto-assign.php'
      - 'tests/voip-auto-assign.test.php'
      - 'lib/voip-link-prefill.php'
      - 'lib/voip-ixc-monitor.php'
      - 'scripts/voip-monitor-ingest.php'
      - 'scripts/voip-monitor-run.sh'
      - 'tests/voip-reconcile.test.php'
      - 'tests/voip-operational.test.php'
      - 'tests/voip-stock-linking.test.php'
      - 'tests/voip-link-prefill.test.php'
      - 'tests/voip-ixc-monitor.test.php'
      - '.github/workflows/voip-reconcile.yml'
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: Lint VoIP files
        run: |
          php -l lib/voip-reconcile.php
          php -l lib/voip-operational.php
          php -l lib/voip-stock.php
          php -l lib/voip-auto-assign.php
          php -l tests/voip-auto-assign.test.php
          php -l lib/voip-link-prefill.php
          php -l lib/voip-ixc-monitor.php
          php -l scripts/voip-monitor-ingest.php
          bash -n scripts/voip-monitor-run.sh
          php -l voip-central.php
          php -l tests/voip-reconcile.test.php
          php -l tests/voip-operational.test.php
          php -l tests/voip-stock-linking.test.php
          php -l tests/voip-link-prefill.test.php
          php -l tests/voip-ixc-monitor.test.php
      - name: Test marker detection without IXC writes
        run: |
          node --check mcp/integrations/ixc-voip-request-inspector.js
          node --check scripts/voip-request-marker-preflight.mjs
          node --test tests/voip-request-marker.test.mjs
      - name: Test reconciliation
        run: |
          php tests/voip-reconcile.test.php
          php tests/voip-operational.test.php
          php tests/voip-stock-linking.test.php
          php tests/voip-auto-assign.test.php
          php tests/voip-link-prefill.test.php
          php tests/voip-ixc-monitor.test.php
