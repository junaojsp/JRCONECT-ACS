name: VoIP IXC Docker candidate validation
on:
  pull_request:
    paths:
      - 'scripts/build-voip-ixc-candidate.sh'
      - 'scripts/promote-voip-ixc-candidate.sh'
      - 'scripts/README-voip-ixc-docker-candidate.md'
      - '.github/workflows/voip-ixc-docker-candidate.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shell syntax
        run: |
          bash -n scripts/build-voip-ixc-candidate.sh
          bash -n scripts/promote-voip-ixc-candidate.sh
      - name: Module syntax and unit tests
        working-directory: mcp
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check integrations/ixc-voip-tools.js
          node --check integrations/ixc-webservice-tools.js
          node --test integrations/ixc-voip-tools.test.js
      - name: No activation during CI
        run: |
          if grep -nE 'docker[[:space:]]+compose.*(down|up.*--remove-orphans)' scripts/build-voip-ixc-candidate.sh; then
            echo "Unexpected destructive Docker command"; exit 1
          fi
